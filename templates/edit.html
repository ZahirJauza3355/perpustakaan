{% extends "base.html" %}
{% block title %}Edit Buku{% endblock %}

{% block content %}

  <div class="page-header">
    <div>
      <a href="{{ url_for('index') }}" class="back-link">&larr; Kembali ke daftar buku</a>
      <h1>Edit Buku</h1>
      <p class="page-subtitle">Perbarui detail untuk "{{ book.judul }}".</p>
    </div>
  </div>

  <div class="form-card">
    <form method="POST" action="{{ url_for('edit_book', id=book.id) }}">

      <div class="form-group">
        <label for="judul">Judul Buku <span class="required">*</span></label>
        <input type="text" id="judul" name="judul" value="{{ book.judul }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="penulis">Penulis <span class="required">*</span></label>
        <input type="text" id="penulis" name="penulis" value="{{ book.penulis }}" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tahun_terbit">Tahun Terbit</label>
          <input type="number" id="tahun_terbit" name="tahun_terbit" min="1000" max="2100"
                 value="{{ book.tahun_terbit or '' }}">
        </div>
        <div class="form-group">
          <label for="stok">Stok</label>
          <input type="number" id="stok" name="stok" min="0" value="{{ book.stok }}">
        </div>
      </div>

      <div class="form-group">
        <label for="kategori_id">Kategori</label>
        <div class="select-with-action">
          <select id="kategori_id" name="kategori_id">
            <option value="">— Tanpa kategori —</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}" {{ 'selected' if book.kategori_id|string == cat.id|string }}>
                {{ cat.nama }}
              </option>
            {% endfor %}
          </select>
          <a href="{{ url_for('add_category') }}" class="btn-inline-add">+ Kategori baru</a>
        </div>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Batal</a>
        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
      </div>

    </form>
  </div>

{% endblock %}
